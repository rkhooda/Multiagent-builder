# Everything irreplaceable lives under ./data on the host — one directory to
# back up, and the only thing `make clean` is forbidden to touch.

services:
  backend:
    # Context is the repo root, not ./backend: the agents load their prompts
    # from /prompts, a sibling of /app, so the build has to reach prompts/.
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: ./backend/.env
    environment:
      # Moves projects.db and metrics.db out of /app, where the application
      # code lives — a mount there would shadow the code itself.
      DATA_DIR: /data
      # backend/.env carries the host default (localhost:11434), which inside a
      # container points at the backend itself. The service name is right here,
      # and overriding it in `environment` beats the env_file value. Set
      # OLLAMA_BASE_URL in the root .env to reach an Ollama running on the host
      # instead (host.docker.internal:11434 on Docker Desktop). When the profile
      # is off the name simply does not resolve, the probe fails, and the chain
      # behaves exactly as it did before local models existed.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      SANDBOX_URL: http://sandbox:8100
    ports:
      - "8000:8000"
    volumes:
      # Directories, never files. A sqlite database in WAL mode is really three
      # files (db, -wal, -shm) that must live together; mounting just the .db
      # leaves its siblings in the container's throwaway layer, and a commit
      # still sitting in the WAL at shutdown disappears without an error.
      - ./data/db:/data
      # OUTPUTS_ROOT already resolves to /outputs in the image (it is computed
      # relative to the source tree, which lands at /app), so generated projects
      # need no code change to persist — only this mount.
      - ./data/outputs:/outputs
    healthcheck:
      # python is guaranteed present in this image; curl and wget are not.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # Build verification sandbox. Holds the Docker socket; holds NOTHING else —
  # no env_file, no ./data/db mount, no writable outputs/. `backend` reaches
  # it over this default network by service name; it publishes no host port,
  # so nothing outside the compose network can reach it either. Every build
  # container IT spawns runs on `sandbox-net` below, not this network — see
  # docs/SANDBOX_THREAT_MODEL.md for why the two are kept apart.
  sandbox:
    build:
      context: .
      dockerfile: backend/sandbox/Dockerfile
    environment:
      # Must be the literal HOST path of the scratch mount below, not a
      # container-side path: this service hands workspace paths to the HOST
      # daemon (over the socket) for the containers it spawns, so the string
      # has to resolve on the host, not inside this container. Mounting the
      # scratch dir at that same absolute path on both sides is what makes a
      # single string valid in both places.
      SANDBOX_SCRATCH_ROOT: ${PWD}/data/sandbox-scratch
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/outputs:/outputs:ro
      - ${PWD}/data/sandbox-scratch:${PWD}/data/sandbox-scratch
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      # 3000 is a crowded default — set FRONTEND_PORT=3001 if another dev server
      # already holds it. Host-side only; nginx still listens on 80 inside.
      - "${FRONTEND_PORT:-3000}:80"
    # Not for readiness — for DNS. nginx resolves `backend` in proxy_pass once,
    # at startup, and exits with "host not found in upstream" if the name does
    # not resolve yet. This guarantees the container exists by then. A backend
    # that is up but not yet listening only costs a few seconds of 502s.
    depends_on:
      - backend
    restart: unless-stopped

  # Absent unless explicitly asked for: `docker compose --profile ollama up`.
  # Day 29 owns local models; the two-service stack above runs without it.
  ollama:
    profiles: [ollama]
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      # A named volume, unlike the app data above, precisely because model
      # weights are opaque multi-gigabyte blobs nobody opens in an editor.
      - ollama_models:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_models:

# `sandbox-net` — where build containers run — is deliberately NOT declared
# here. A Compose network with no service attached to it is never actually
# created by `docker compose up` (verified empirically: declaring it and no
# service referencing it left it absent from `docker network ls`), so a
# top-level declaration would be dead configuration. `sandbox`'s runner
# creates it lazily and idempotently on first use (`runner.ensure_network()`)
# instead — the only thing that ever needs it to exist is the `docker run
# --network sandbox-net` call the runner itself makes. No service in this
# file is a member of it: that absence is what keeps every build container
# off the network backend/frontend/sandbox share. See
# docs/SANDBOX_THREAT_MODEL.md.
