server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA routing. A refresh on /projects/abc has no file behind it, so it must
    # fall back to index.html and let react-router resolve the path client-side.
    # This never touches /api or /ws: nginx matches the LONGEST prefix, so those
    # requests hit their own blocks below and try_files is not consulted.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # proxy_pass deliberately carries NO path. With a trailing path nginx strips
    # the matched prefix and substitutes it, which only works if the arithmetic
    # is right. The backend already serves these exact paths, so there is
    # nothing to rewrite and the URI passes through untouched.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://backend:8000;

        # These three ARE the WebSocket handshake, and this is why "the live
        # feed is silently dead behind nginx" is the canonical failure for this
        # kind of stack. nginx talks HTTP/1.0 upstream by default, and
        # Upgrade/Connection are hop-by-hop headers it strips when proxying. Omit
        # any one and uvicorn sees an ordinary GET: the page loads, the API
        # works, and no events ever arrive.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;

        # A timeout on SILENCE, reset by every frame — not a cap on connection
        # age. Day 4's 15s heartbeat makes the 60s default technically
        # survivable, but two things argue against relying on that: a project
        # parked at a gate emits nothing while the user is away, and the
        # heartbeat shares an event loop that Day 26's pacing sleeps and a
        # 354-second QA call can block. An idle held connection costs nothing;
        # the failure it prevents is silent. Day 5's reconnect covers the rest.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
